# Task J — production topology.
#
#   docker compose --env-file .env.build -f docker-compose.prod.yml up -d --build
#
# THE --env-file IS NOT OPTIONAL. build.args are resolved from it (see the args
# block below), and without it the Vite bundle is built with no Supabase
# configuration and serves a blank white page. deploy.sh always passes it.
#
# NO DATABASE CONTAINER, DELIBERATELY. Supabase is managed, so Postgres, Auth,
# Storage and the REST layer all live outside this host. The only local
# dependency the app has is the network route to SUPABASE_URL, which is why this
# file is one service and not three.
#
# TLS IS NOT TERMINATED HERE EITHER. The port is published to the host's
# loopback so a reverse proxy running ON THE HOST (Traefik, per the deployment
# notes) can reach it while the container itself stays off the public internet.
# If the proxy is instead a container on this same compose network, drop the
# ports block entirely and let it address this service by name.
#
# This is distinct from ./docker-compose.yml, which is the DEVELOPMENT compose:
# it mounts the source tree and runs "npm run dev". Using that one in production
# would serve an unbuilt tree with a dev server.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # BUILD-TIME ONLY, AND env_file BELOW DOES NOT FEED THESE. Compose
      # resolves build.args from the shell environment / the --env-file it was
      # invoked with — NOT from a service's env_file: — so a plain
      # "up -d --build" leaves these empty and reproduces the blank white page.
      # deploy.sh therefore always passes --env-file .env.build (see below).
      #
      # These are the only two variables the Vite bundle needs. Both are public
      # by design — the publishable key ships to every browser — which is
      # exactly why a dedicated build file may hold them while the real secrets
      # stay in .env.production and never enter a build arg or an image layer.
      #
      # The :? form fails the build with this message rather than silently
      # producing a bundle that throws during its first render.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?missing — put it in .env.build; Vite inlines it at build time and the client renders a blank page without it}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?missing — put it in .env.build; Vite inlines it at build time and the client renders a blank page without it}
    image: jobbeacon:latest
    container_name: jobbeacon-app

    # unless-stopped, not always: a container an operator stopped on purpose
    # should stay stopped across a host reboot.
    restart: unless-stopped

    # The real environment. .env.production is NOT in the repository and is not
    # shipped by deploy.sh — it is placed on the host by hand, because it holds
    # SUPABASE_SERVICE_ROLE_KEY and every other credential the app uses. The
    # .dockerignore excludes .env files so they can never be baked into an image
    # layer even by an accidental "COPY . .".
    #
    # THIS IS RUNTIME ONLY. It reaches the container's process environment, so
    # the Express server reads it — but it CANNOT configure the already-compiled
    # Vite bundle. Client-visible values must be build args instead, which is
    # why .env.build exists separately and holds only the two public VITE_*
    # variables.
    env_file:
      - .env.production

    environment:
      # Repeated from the image on purpose so the reason is visible where the
      # deployment is configured, not only buried in the Dockerfile: the server
      # defaults HOST to 127.0.0.1, which would leave every published port dead.
      HOST: "0.0.0.0"
      PORT: "5000"
      NODE_ENV: "production"

    ports:
      - "127.0.0.1:5000:5000"

    # Inherits HEALTHCHECK from the image (GET /api/health), so "docker ps"
    # reports health rather than only whether the process is alive.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

    # Bounded logs. The default json-file driver has no size limit, so a
    # crash-looping container can fill the VPS disk — and a full disk takes the
    # database connection pool and everything else down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    # ---------------------------------------------------------------------
    # Traefik routing. There is no config file to edit: Traefik runs with the
    # Docker provider and exposedbydefault=false, so these labels ARE the
    # routing configuration, and without traefik.enable=true nothing routes.
    #
    # traefik.docker.network is required rather than redundant. This container
    # joins two networks, and without naming the one Traefik should dial it
    # picks whichever it finds first — which may be an address it cannot reach.
    #
    # THE LOOPBACK PORT PUBLISH ABOVE IS KEPT, and it is not redundant with
    # these labels. deploy.sh's local health check polls 127.0.0.1:5000 from the
    # host; Traefik reaches the container over traefik-proxy instead. The two
    # checks answer different questions: "is the process up" and "is the route
    # up". Only the second one would have caught the 404s this replaces.
    #
    # The router and service are named jobbeacon rather than reusing the
    # stopped jobbeacon-web stack's names, so that starting that stack later
    # cannot silently collide with this one.
    # ---------------------------------------------------------------------
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"

      - "traefik.http.routers.jobbeacon.rule=Host(`jobbeacon.in`) || Host(`www.jobbeacon.in`)"
      - "traefik.http.routers.jobbeacon.entrypoints=websecure"
      - "traefik.http.routers.jobbeacon.tls=true"
      - "traefik.http.routers.jobbeacon.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jobbeacon.service=jobbeacon"
      - "traefik.http.routers.jobbeacon.middlewares=jobbeacon-secure-headers"

      - "traefik.http.services.jobbeacon.loadbalancer.server.port=5000"
      - "traefik.http.services.jobbeacon.loadbalancer.server.scheme=http"
      - "traefik.http.services.jobbeacon.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.jobbeacon.loadbalancer.healthcheck.interval=20s"

      # HSTS is set with the same values the previous stack used, so browsers
      # that already cached a policy for this domain see no change. Note
      # stsIncludeSubdomains + stsPreload cover every subdomain of jobbeacon.in.
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.jobbeacon-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

    networks:
      - default
      - traefik-proxy

  # ---------------------------------------------------------------------------
  # Task D — the autonomous scheduler (server/scheduler.ts).
  #
  # A SECOND PROCESS FROM THE SAME IMAGE, and it has to be. The runtime image
  # contains only dist/ and production node_modules — no server/ source and no
  # tsx (a devDependency) — so "npm run scheduler" cannot run in there. The entry
  # point is the compiled dist/server/server/scheduler.js, alongside the index.js
  # the app service runs.
  #
  # IT SERVES NO HTTP: no ports, no Traefik labels, no traefik-proxy network. The
  # healthcheck is DISABLED rather than left to fail: the image's HEALTHCHECK
  # probes :5000/api/health, which this process never answers, so the container
  # would sit permanently "unhealthy" and tell an operator nothing true.
  #
  # SCHEDULER_DISABLED_TASKS IS AN OFF-LIST. The scheduler builds every task it
  # can and removes the names listed here, so this list is what keeps the
  # model-backed tasks (fit-analysis, anti-ghosting, mailbox-classify) and the
  # network task (discovery) switched OFF. Enabling one later means deleting its
  # name from this list, not editing code.
  #
  # OPENROUTER_API_KEY IS STILL REQUIRED even though every task left enabled is
  # DB-only: scheduler.ts constructs the OpenAI client before it filters the task
  # list. Without the key the process logs "cannot start", exits 0, and
  # unless-stopped restarts it into the same loop — visible only in the logs.
  # ---------------------------------------------------------------------------
  scheduler:
    image: jobbeacon:latest
    container_name: jobbeacon-scheduler
    command: ["node", "dist/server/server/scheduler.js"]
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: "production"
      SCHEDULER_DISABLED_TASKS: "fit-analysis,anti-ghosting,mailbox-poll,mailbox-classify,mailbox-match,calendar-sync,discovery"
      SCHEDULER_RANKING_REFRESH_INTERVAL_MS: "600000"
      SCHEDULER_REFRESH_MAX_CANDIDATES_PER_TICK: "20"
      SCHEDULER_REFRESH_PER_CANDIDATE_DEADLINE_MS: "10000"
      SCHEDULER_REFRESH_TICK_DEADLINE_MS: "120000"
    depends_on:
      - app
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

# Traefik's own compose declares this external, so it is referenced rather than
# created here: a stack that tried to define it would clash with the running
# proxy on the network name.
networks:
  traefik-proxy:
    external: true
